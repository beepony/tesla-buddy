name: TeslaCompanion
options:
  minimumXcodeGenVersion: 2.41.0
settings:
  base:
    SWIFT_VERSION: 6.0
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
    CURRENT_PROJECT_VERSION: 28
    MARKETING_VERSION: 1.4.0
targets:
  TeslaCompanion:
    type: application
    productName: Tesla Buddy
    platform: iOS
    sources:
      - path: Sources
      - path: Shared
      - path: Assets.xcassets
    dependencies:
      - target: ChargingWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.teslacompanion
        PRODUCT_NAME: Tesla Buddy
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: XP22J2NPC5
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Supporting/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: 1
    scheme:
      testTargets: []
  ChargingWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: ChargingWidget
        excludes: [Info.plist]
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.teslacompanion.charging
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: XP22J2NPC5
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: ChargingWidget/Info.plist
        TARGETED_DEVICE_FAMILY: 1
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
