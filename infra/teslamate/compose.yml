name: tesla-companion

services:
  teslamate:
    image: teslamate/teslamate:latest
    restart: unless-stopped
    environment:
      ENCRYPTION_KEY: ${TESLAMATE_ENCRYPTION_KEY}
      DATABASE_USER: teslamate
      DATABASE_PASS: ${TESLAMATE_DATABASE_PASSWORD}
      DATABASE_NAME: teslamate
      DATABASE_HOST: database
      MQTT_HOST: mosquitto
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - teslamate-import:/opt/app/import
    cap_drop:
      - ALL
    depends_on:
      database:
        condition: service_healthy
      mosquitto:
        condition: service_started

  database:
    image: postgres:18-trixie
    restart: unless-stopped
    environment:
      POSTGRES_USER: teslamate
      POSTGRES_PASSWORD: ${TESLAMATE_DATABASE_PASSWORD}
      POSTGRES_DB: teslamate
    volumes:
      - teslamate-db:/var/lib/postgresql
    ports:
      # Companion API needs host access; PostgreSQL remains unreachable from LAN.
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teslamate -d teslamate"]
      interval: 10s
      timeout: 5s
      retries: 10

  grafana:
    image: teslamate/grafana:latest
    restart: unless-stopped
    environment:
      DATABASE_USER: teslamate
      DATABASE_PASS: ${TESLAMATE_DATABASE_PASSWORD}
      DATABASE_NAME: teslamate
      DATABASE_HOST: database
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - teslamate-grafana-data:/var/lib/grafana
    depends_on:
      database:
        condition: service_healthy

  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    command: mosquitto -c /mosquitto/config/mosquitto.conf
    ports:
      - "127.0.0.1:1883:1883"
    volumes:
      - ../mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data

volumes:
  teslamate-import:
  teslamate-db:
  teslamate-grafana-data:
  mosquitto-data:
